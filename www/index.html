<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance – Tikariya’s School of Music</title>
<style>
:root{--on:#fff;--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7385;--line:#e2e6ef;--pri:#1f3864;--g:#1e8e4e;--gb:#d8f3e3;--r:#c62828;--rb:#fde0e0;--a:#b26a00;--ab:#fff0cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mut:#97a0b5;--line:#2a3349;--on:#0f1420;--pri:#7fa2e6;--g:#5fd08c;--gb:#16382a;--r:#ff8a80;--rb:#44201f;--a:#ffc15e;--ab:#42330f}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mut:#97a0b5;--line:#2a3349;--on:#0f1420;--pri:#7fa2e6;--g:#5fd08c;--gb:#16382a;--r:#ff8a80;--rb:#44201f;--a:#ffc15e;--ab:#42330f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif;padding-bottom:76px}
header{background:var(--pri);color:var(--on);padding:14px 16px}
header h1{margin:0;font-size:18px}header small{opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 14px}
button.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:8px}.row>.grow{flex:1;min-width:0}
.nm{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:var(--mut)}
.pa{display:flex;gap:6px}.pa button{width:44px;height:44px;padding:0;font-weight:bold}
.pa .on-P{background:var(--gb);color:var(--g);border-color:var(--g)}.pa .on-A{background:var(--rb);color:var(--r);border-color:var(--r)}.pa .on-L{background:var(--ab);color:var(--a);border-color:var(--a)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:bold}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;background:none;color:var(--mut);font-size:14px}nav button.on{color:var(--pri);font-weight:bold;border-top:3px solid var(--pri);padding-top:11px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.low{color:var(--r);font-weight:bold}.empty{text-align:center;color:var(--mut);padding:24px 8px}
.del{color:var(--r)}
a.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 14px;margin:4px 4px 0 0}summary{cursor:pointer;color:var(--pri)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;width:100%;color:#000;background:#fff;font-family:Arial,sans-serif}body{background:#fff;padding:0}#pr *{color:#000!important;background:none!important}#pr table{width:100%;border-collapse:collapse}#pr th,#pr td{border:1px solid #444;padding:7px;font-size:14px;text-align:center}#pr .top~table th,#pr .top~table td{padding:5px 8px}#pr .cal{width:auto;table-layout:fixed}#pr .cal th,#pr .cal td{width:15mm;height:15mm;padding:1px;vertical-align:middle;text-align:center;font-size:11px;line-height:1.2}#pr .top{display:flex;gap:8mm;align-items:flex-start}#pr .top>div{flex:1}#pr .nm2{font-size:34px;font-weight:bold}#pr>div+div{page-break-before:always}#pr>div{width:186mm;min-height:266mm;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box}#pr .top~table{flex:1}#pr .top{margin-bottom:3mm}#pr .st{font-weight:bold;font-size:17px}#pr h2{margin:0 0 4px;font-size:24px}#pr .sub{font-size:14px}@page{size:A4 portrait;margin:12mm}}
</style>
</head>
<body>
<header><h1>Tikariya’s School of Music</h1><small>Student Attendance</small></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var S={students:[],att:{},pay:{}},tab="mark",date=today(),month=today().slice(0,7),ref=null,timer=null,ready=false,editId=null;
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var TARGET=12,WEEK=3;
function isSun(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10)).getDay()===0}
function wk(id,k){var d=new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));d.setDate(d.getDate()-(d.getDay()+6)%7);var n=0;for(var i=0;i<6;i++){var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.att[key]&&S.att[key][id]==="P")n++;d.setDate(d.getDate()+1)}return n}
function prog(s,k){var c=counts(s.id,k.slice(0,7));return (c.done?"Month completed ✓"+(c.bonus?" · "+c.bonus+" bonus":""):c.p+"/"+TARGET+" this month")+" · Week "+wk(s.id,k)+"/"+WEEK}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function lsGet(){try{return localStorage.getItem("tsm_att")}catch(e){return null}}
function lsSet(v){try{localStorage.setItem("tsm_att",v)}catch(e){}}
function save(){var j=JSON.stringify(S);lsSet(j);clearTimeout(timer);timer=setTimeout(function(){if(ref){ref.set({json:j}).catch(function(){})}},600)}
async function init(){
  render();
  try{
    var user=await claude.use("user"),db=await claude.use("db");
    if(user&&db){var id=await user.id();ref=db.collection("data/users/"+id).doc("state");var snap=await ref.get();
      if(snap.exists&&snap.data()&&snap.data().json){S=JSON.parse(snap.data().json)}else{var l=lsGet();if(l)S=JSON.parse(l);save()}}
    else{var l2=lsGet();if(l2)S=JSON.parse(l2)}
  }catch(e){try{var l3=lsGet();if(l3)S=JSON.parse(l3)}catch(x){}}
  S.students=S.students||[];S.att=S.att||{};S.pay=S.pay||{};ready=true;render();
}
function setAtt(id,v){var d=S.att[date]=S.att[date]||{};if(d[id]===v)delete d[id];else d[id]=v;save();render()}
function markAll(){var d=S.att[date]=S.att[date]||{};S.students.forEach(function(s){d[s.id]="P"});save();render()}
function counts(id,m){var p=0,a=0,l=0;for(var k in S.att){if(k.indexOf(m)===0&&!isSun(k)){var v=S.att[k][id];if(v==="P")p++;else if(v==="A")a++;else if(v==="L")l++}}return {p:p,a:a,l:l,pct:(p+a)?Math.round(100*p/(p+a)):null,done:p>=TARGET,bonus:Math.max(0,p-TARGET)}}
function addStudent(){var n=document.getElementById("fn").value.trim();if(!n)return;
  var c=document.getElementById("fc").value.trim(),b=document.getElementById("fb").value.trim(),ad=document.getElementById("fa").value,fe=Number(document.getElementById("ff").value)||0;
  if(editId){S.students.forEach(function(s){if(s.id===editId){s.name=n;s.course=c;s.batch=b;s.adm=ad;s.fee=fe}});editId=null}
  else S.students.push({id:uid(),name:n,course:c,batch:b,adm:ad,fee:fe});
  save();render()}
function delStudent(id){var s=S.students.filter(function(x){return x.id===id})[0];
  if(!confirm("Delete "+s.name+" and all their attendance?"))return;
  S.students=S.students.filter(function(x){return x.id!==id});for(var k in S.att)delete S.att[k][id];delete S.pay[id];save();render()}
async function exportCsv(){
  var dim=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate(),h=["Student","Course","Batch"];
  for(var d=1;d<=dim;d++)h.push(d);h.push("Present","Absent","Leave","Month completed","Bonus days","Monthly fee","Fee status");
  var rows=[h];
  S.students.forEach(function(s){var r=[s.name,s.course||"",s.batch||""];
    for(var d=1;d<=dim;d++){var k=month+"-"+String(d).padStart(2,"0");r.push(isSun(k)?"Sun":(S.att[k]&&S.att[k][s.id])||"")}
    var c=counts(s.id,month);r.push(c.p,c.a,c.l,c.done?"Yes":"No ("+c.p+"/"+TARGET+")",c.bonus,s.fee||"",(S.pay[s.id]&&S.pay[s.id][month])?"Paid":"Unpaid");rows.push(r)});
  var csv="\ufeff"+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  try{var dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:"Attendance_"+month+".csv",data:csv})}
  catch(e){if(e&&e.code==="declined")return;try{var u=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));var a=document.createElement("a");a.href=u;a.download="Attendance_"+month+".csv";a.click()}catch(x){alert("Download is not available here.")}}
}
function vMark(){
  var h='<div class="card"><label>Date</label><input type="date" id="dt" value="'+date+'"></div>';
  if(isSun(date))return h+'<div class="empty">Sunday is a holiday – no class today.</div>';
  if(!S.students.length)return h+'<div class="empty">No students yet. Go to the Students tab and add your students.</div>';
  var d=S.att[date]||{},p=0,a=0,l=0;S.students.forEach(function(s){var v=d[s.id];if(v==="P")p++;else if(v==="A")a++;else if(v==="L")l++});
  h+='<div class="row"><div class="chips grow"><span class="chip" style="background:var(--gb);color:var(--g)">Present '+p+'</span><span class="chip" style="background:var(--rb);color:var(--r)">Absent '+a+'</span><span class="chip" style="background:var(--ab);color:var(--a)">Leave '+l+'</span></div><button onclick="markAll()">All present</button></div>';
  S.students.forEach(function(s){var v=d[s.id];
    h+='<div class="card row"><div class="grow"><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc([s.course,s.batch].filter(Boolean).join(" · "))+'</div><div class="sub">'+prog(s,date)+'</div></div><div class="pa">'+
    ["P","A","L"].map(function(x){return '<button class="'+(v===x?"on-"+x:"")+'" onclick="setAtt(\''+s.id+'\',\''+x+'\')">'+x+'</button>'}).join("")+'</div></div>'});
  return h}
function vStudents(){
  var e=S.students.filter(function(s){return s.id===editId})[0]||{name:"",course:"",batch:"",adm:"",fee:""};
  var h='<div class="card"><b>'+(editId?"Edit student":"Add student")+'</b><label>Name</label><input id="fn" value="'+esc(e.name)+'"><label>Course / Instrument</label><input id="fc" value="'+esc(e.course)+'" placeholder="Harmonium, Tabla, Vocals…"><label>Batch time</label><input id="fb" value="'+esc(e.batch)+'" placeholder="5:00 PM"><label>Date of admission</label><input type="date" id="fa" value="'+esc(e.adm)+'"><label>Monthly fee (₹)</label><input type="number" inputmode="numeric" id="ff" value="'+esc(e.fee||"")+'" placeholder="1000"><div class="row" style="margin-top:12px"><button class="pri grow" onclick="addStudent()">'+(editId?"Save":"Add")+'</button>'+(editId?'<button onclick="editId=null;render()">Cancel</button>':'')+'</div></div>';
  h+='<div class="sub" style="margin:4px 2px 8px">'+S.students.length+' students</div>';
  S.students.forEach(function(s){h+='<div class="card row"><div class="grow"><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc([s.course,s.batch].filter(Boolean).join(" · "))+'</div><div class="sub">'+(s.adm?'Admitted '+esc(fd(s.adm)):'No admission date')+' · '+(s.fee?money(s.fee)+'/month':'Fee not set')+'</div></div><button onclick="editId=\''+s.id+'\';render();scrollTo(0,0)">Edit</button><button class="del" onclick="delStudent(\''+s.id+'\')">Delete</button></div>'});
  return h}
function vReport(){
  var h='<div class="card"><label>Month</label><input type="month" id="mo" value="'+month+'"></div>';
  if(!S.students.length)return h+'<div class="empty">Add students first.</div>';
  h+='<div class="card" style="overflow-x:auto"><table><tr><th>Student</th><th>P</th><th>A</th><th>L</th><th>Month</th><th>Bonus</th></tr>';
  S.students.forEach(function(s){var c=counts(s.id,month);h+='<tr><td>'+esc(s.name)+'</td><td>'+c.p+'</td><td>'+c.a+'</td><td>'+c.l+'</td><td style="'+(c.done?"color:var(--g);font-weight:bold":"")+'">'+(c.done?"Done ✓":c.p+"/"+TARGET)+'</td><td>'+(c.bonus||"–")+'</td></tr>'});
  return h+'</table></div><div class="sub" style="margin:0 2px 10px">Sunday is a holiday. Commitment is 12 days a month (about 3 a week). 12 present days complete the month, and extra days are bonus days.</div><button class="pri" style="width:100%" onclick="exportCsv()">Download for Excel (CSV)</button>'}
function money(x){return "₹"+Number(x||0).toLocaleString("en-IN")}
function fd(d){return d?d.split("-").reverse().join("/"):""}
function mi(ym){return +ym.slice(0,4)*12+ +ym.slice(5,7)-1}
function ym(i){return Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0")}
function startIdx(s){return s.adm?mi(s.adm.slice(0,7)):mi(month)}
function pending(s){var n=0,p=S.pay[s.id]||{};for(var i=startIdx(s);i<=mi(month);i++){if(!p[ym(i)])n++}return n}
function togglePay(id){var p=S.pay[id]=S.pay[id]||{};if(p[month])delete p[month];else p[month]=true;save();render()}
function vFees(){
  var h='<div class="card"><label>Fees for month</label><input type="month" id="mo" value="'+month+'"></div>';
  var list=S.students.filter(function(s){return startIdx(s)<=mi(month)});
  if(!list.length)return h+'<div class="empty">No students admitted by this month.</div>';
  var got=0,due=0,all=0;list.forEach(function(s){var paid=S.pay[s.id]&&S.pay[s.id][month];if(paid)got+=+s.fee||0;else due+=+s.fee||0;all+=pending(s)*(+s.fee||0)});
  h+='<div class="chips"><span class="chip" style="background:var(--gb);color:var(--g)">Collected '+money(got)+'</span><span class="chip" style="background:var(--rb);color:var(--r)">This month due '+money(due)+'</span><span class="chip" style="background:var(--ab);color:var(--a)">Total pending '+money(all)+'</span></div>';
  list.forEach(function(s){var paid=S.pay[s.id]&&S.pay[s.id][month],n=pending(s);
    h+='<div class="card row"><div class="grow"><div class="nm">'+esc(s.name)+'</div><div class="sub">'+(s.fee?money(s.fee)+'/month':'Fee not set – add it in Students')+(s.adm?' · Admitted '+esc(fd(s.adm)):'')+'</div><div class="sub '+(n?'low':'')+'">'+(n?'Pending: '+n+' month'+(n>1?'s':'')+' · '+money(n*(+s.fee||0)):'All paid up to this month')+'</div></div><button class="'+(paid?'on-P':'')+'" style="min-width:84px;'+(paid?'background:var(--gb);color:var(--g);border-color:var(--g)':'background:var(--rb);color:var(--r);border-color:var(--r)')+'" onclick="togglePay(\''+s.id+'\')">'+(paid?'Paid':'Unpaid')+'</button></div>'});
  return h+'<div class="sub" style="margin:0 2px">Tap Paid / Unpaid to change this month’s status. Pending counts every month from the admission date up to the month selected.</div>'}
function render(){
  var el=document.getElementById("app");
  el.innerHTML=!ready?'<div class="empty">Loading…</div>':(tab==="mark"?vMark():tab==="profile"?vProfile():tab==="data"?vData():tab==="students"?vStudents():tab==="fees"?vFees():vReport());
  document.getElementById("nav").innerHTML=[["mark","Attendance"],["students","Students"],["fees","Fees"],["report","Report"],["data","Backup"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("");
  var dt=document.getElementById("dt");if(dt)dt.onchange=function(){date=dt.value||today();render()};
  var mo=document.getElementById("mo");if(mo)mo.onchange=function(){month=mo.value||today().slice(0,7);render()};
}
/* v3: month = cycle from admission date; bonus days; teacher leave */
var asof=today(),openId=null,MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function hol(){S.hol=S.hol||{};return S.hol}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))}
function sd(k){var d=pd(k);return d.getDate()+' '+MN[d.getMonth()]}
function cs(adm,k){var a=pd(adm),m0=a.getMonth()+k,yy=a.getFullYear()+Math.floor(m0/12),mm=m0%12,dim=new Date(yy,mm+1,0).getDate();return new Date(yy,mm,Math.min(a.getDate(),dim))}
function cyc(s,upto){var adm=s.adm||upto.slice(0,8)+'01',out=[],bank=0;if(adm>upto)return out;
  for(var k=0;k<400;k++){var st=cs(adm,k);if(dstr(st)>upto)break;var en=cs(adm,k+1);en.setDate(en.getDate()-1);
    var p=0,a=0,l=0,t=0,d=new Date(st),e=dstr(en);
    for(;dstr(d)<=e;d.setDate(d.getDate()+1)){var key=dstr(d);if(d.getDay()===0)continue;if(hol()[key]){t++;continue}var v=S.att[key]&&S.att[key][s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++}
    var used=Math.min(t,bank,Math.max(0,TARGET-p)),earn=Math.max(0,p-TARGET);bank=bank-used+earn;
    out.push({start:dstr(st),end:e,p:p,a:a,l:l,t:t,used:used,eff:p+used,done:p+used>=TARGET,bonus:earn,bank:bank,key:dstr(st)})}
  return out}
function lastc(s,k){var c=cyc(s,k);return c[c.length-1]}
function prog(s,k){var x=lastc(s,k);if(!x)return 'Not admitted yet';
  return sd(x.start)+'–'+sd(x.end)+': '+(x.done?'Month completed ✓':x.eff+'/'+TARGET)+(x.bonus?' · '+x.bonus+' bonus':'')+(x.bank?' · Bonus balance '+x.bank:'')+' · Week '+wk(s.id,k)+'/'+WEEK+(s.adm?'':' · set admission date')}
function toggleOff(){var o=hol();if(o[date])delete o[date];else o[date]=true;save();render()}
function tp(id,key){var p=S.pay[id]=S.pay[id]||{};if(p[key])delete p[key];else p[key]=true;save();render()}
function xo(id){openId=openId===id?null:id;render()}
function vMark(){
  var h=`<div class='card'><label>Date</label><input type='date' id='dt' value='${date}'></div>`;
  if(isSun(date))return h+`<div class='empty'>Sunday is a holiday – no class today.</div>`;
  var off=hol()[date];
  h+=`<div class='row' style='margin-bottom:8px'><div class='grow sub'>${off?'Class off (teacher leave). Bonus days cover this day.':''}</div><button onclick='toggleOff()'>${off?'Cancel teacher leave':'Mark teacher leave'}</button></div>`;
  if(off)return h;
  if(!S.students.length)return h+`<div class='empty'>No students yet. Go to the Students tab and add your students.</div>`;
  var d=S.att[date]||{},p=0,a=0,l=0;S.students.forEach(s=>{var v=d[s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++});
  h+=`<div class='row'><div class='chips grow'><span class='chip' style='background:var(--gb);color:var(--g)'>Present ${p}</span><span class='chip' style='background:var(--rb);color:var(--r)'>Absent ${a}</span><span class='chip' style='background:var(--ab);color:var(--a)'>Leave ${l}</span></div><button onclick='markAll()'>All present</button></div>`;
  S.students.forEach(s=>{var v=d[s.id];
    h+=`<div class='card row'><div class='grow'><div class='nm'>${esc(s.name)}</div><div class='sub'>${esc([s.course,s.batch].filter(Boolean).join(' · '))}</div><div class='sub'>${prog(s,date)}</div></div><div class='pa'>${['P','A','L'].map(x=>`<button data-i='${s.id}' data-v='${x}' class='${v===x?'on-'+x:''}' onclick='setAtt(this.dataset.i,this.dataset.v)'>${x}</button>`).join('')}</div></div>`});
  return h}
function vFees(){
  var h='',tot=0;
  if(!S.students.length)return `<div class='empty'>Add students first.</div>`;
  S.students.forEach(s=>{
    if(!s.adm){h+=`<div class='card'><div class='nm'>${esc(s.name)}</div><div class='sub'>Set the admission date in the Students tab</div></div>`;return}
    var c=cyc(s,today()),pay=S.pay[s.id]||{},n=0;c.forEach(x=>{if(!pay[x.key])n++});
    var amt=n*(+s.fee||0);tot+=amt;var cur=c[c.length-1];
    if(!cur){h+=`<div class='card'><div class='nm'>${esc(s.name)}</div><div class='sub'>Starts on ${esc(fd(s.adm))}</div></div>`;return}
    var paid=pay[cur.key];

async function saveFile(fn,text,type){try{var dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:fn,data:text})}catch(e){if(e&&e.code==='declined')return;try{var u=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));var a=document.createElement('a');a.href=u;a.download=fn;a.click()}catch(x){alert('Download is not available here.')}}}
function csvText(rows){return '\ufeff'+rows.map(r=>r.map(x=>Q+String(x==null?'':x).split(Q).join(Q+Q)+Q).join(',')).join('\r\n')}
function parseCsv(t){var r=[],row=[],c='',q=false;t=t.replace(/^\ufeff/,'');for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch===Q){if(t[i+1]===Q){c+=Q;i++}else q=false}else c+=ch}else if(ch===Q)q=true;else if(ch===','){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';r.push(row);row=[]}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}

function restore(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(String(r.result)),d=j.data||j;if(!d||!Array.isArray(d.students))throw 0;

function importCsv(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var rows=parseCsv(String(r.result)).filter(x=>x.some(c=>c.trim()));if(rows.length<2){alert('No rows found in this file.');return}
  var map=rows[0].map(h=>{h=h.toLowerCase();var par=/parent|father|mother|guardian/.test(h),ph=/phone|mobile|whats|contact|number/.test(h);
    if(par&&ph)return 'pphone';if(par)return 'parent';if(/email|e-mail/.test(h))return 'email';if(ph)return 'phone';if(/birth|dob/.test(h))return 'dob';if(/address/.test(h))return 'addr';if(/course|instrument/.test(h))return 'course';if(/batch|timing|slot/.test(h))return 'batch';if(/admission|joining|join/.test(h))return 'adm';if(/fee/.test(h))return 'fee';if(/name/.test(h))return 'name';return ''});
  var n=0,have=S.students.map(s=>s.name.toLowerCase());

var CP=(window.Capacitor&&window.Capacitor.Plugins)||{};
async function saveFile(fn,text,type){
  try{var FS=CP.Filesystem,SH=CP.Share;if(!FS||!SH)throw new Error('noplugin');
    var r=await FS.writeFile({path:fn,data:text,directory:'CACHE',encoding:'utf8'});
    await SH.share({title:fn,files:[r.uri],dialogTitle:'Save or send '+fn})}
  catch(e){var m=String((e&&e.message)||e).toLowerCase();if(m.indexOf('cancel')>=0)return;
    try{var u=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));var a=document.createElement('a');a.href=u;a.download=fn;a.click()}catch(x){alert('Could not save the file.')}}}
