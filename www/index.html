<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4b2350">
<title>TSM</title>
<style>
  :root {
    --paper: #f4f2f7;
    --panel: #ffffff;
    --ink: #211a2b;
    --muted: #6a6275;
    --line: #e3dceb;
    --plum: #4b2350;
    --plum-soft: #ebe1ee;
    --teal: #1c7c7d;
    --teal-soft: #d9efee;
    --amber-ink: #8a5300;
    --amber-soft: #fbecc9;
    --red: #a63a3a;
    --red-soft: #f7dede;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }

  .top { position: relative; overflow: hidden; background: var(--plum); color: #fff;
         padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 22px; }
  .staff { position: absolute; left: 0; right: 0; top: 50%; height: 41px; margin-top: -8px;
           background: repeating-linear-gradient(to bottom, rgba(255,255,255,.2) 0 1px, transparent 1px 10px); }
  .top-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; margin: 0 auto; }
  .top h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.5rem; line-height: 1.2; letter-spacing: .01em;
